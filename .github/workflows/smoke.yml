name: Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'   # weekly on Monday

jobs:
  smoke:
    name: Playwright Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run smoke
