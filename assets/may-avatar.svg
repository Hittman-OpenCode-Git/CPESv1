<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-label="May, your exam guide, idle" class="may-avatar may-idle" id="may-avatar" role="img" viewBox="0 0 200 240">

  
  <g id="may-body">
    
